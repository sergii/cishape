[package]
name = "cishape"
version = "0.1.1"
edition = "2024"
description = "Vendor-neutral CI workload profiler and runner-shape optimizer"
repository = "https://github.com/sergii/cishape"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
duckdb = { version = "=1.10505.0", features = ["bundled"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "=3.4.2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
