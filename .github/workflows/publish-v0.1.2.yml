name: Publish v0.1.2

on:
  push:
    branches:
      - main
    paths:
      - "release/v0.1.2.json"
      - ".github/workflows/publish-v0.1.2.yml"

permissions:
  contents: read

concurrency:
  group: cishape-v0.1.2-publication
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  candidate:
    name: verify-release-bits
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify release marker and package metadata
        id: meta
        run: |
          set -euo pipefail
          marker_version="$(jq -r '.version' release/v0.1.2.json)"
          marker_tag="$(jq -r '.tag' release/v0.1.2.json)"
          marker_target="$(jq -r '.target' release/v0.1.2.json)"
          marker_license="$(jq -r '.license' release/v0.1.2.json)"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cishape") | .version')"
          cargo_license="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "cishape") | .license')"
          host="$(rustc -vV | awk '/^host:/ {print $2}')"

          [ "${marker_version}" = "0.1.2" ]
          [ "${marker_tag}" = "v0.1.2" ]
          [ "${marker_target}" = "x86_64-unknown-linux-gnu" ]
          [ "${marker_license}" = "AGPL-3.0-only" ]
          [ "${cargo_version}" = "${marker_version}" ]
          [ "${cargo_license}" = "${marker_license}" ]
          [ "${host}" = "${marker_target}" ]

          package="cishape-v${marker_version}-${marker_target}"
          echo "version=${marker_version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${marker_tag}" >> "${GITHUB_OUTPUT}"
          echo "target=${marker_target}" >> "${GITHUB_OUTPUT}"
          echo "package=${package}" >> "${GITHUB_OUTPUT}"

      - name: Resolve exact dependency lock
        id: lock
        run: |
          set -euo pipefail
          cargo generate-lockfile
          echo "sha256=$(sha256sum Cargo.lock | awk '{print $1}')" >> "${GITHUB_OUTPUT}"

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cishape-release
          key: duckdb-1.10505.0

      - name: Audit third-party licenses
        run: bash scripts/generate-third-party-licenses.sh .cishape/release/THIRD_PARTY_LICENSES.html

      - name: Regression test unknown current-runner cost evidence
        run: cargo test --locked leaves_current_cost_unknown_when_current_runner_is_not_in_catalog

      - name: Build locked release binary
        run: cargo build --release --locked --bin cishape

      - name: Package release bits
        id: package
        env:
          PACKAGE: ${{ steps.meta.outputs.package }}
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ steps.meta.outputs.target }}
        run: |
          set -euo pipefail
          mkdir -p "dist/${PACKAGE}"
          cp target/release/cishape "dist/${PACKAGE}/cishape"
          cp README.md "dist/${PACKAGE}/README.md"
          cp docs/quickstart.md "dist/${PACKAGE}/QUICKSTART.md"
          cp LICENSE "dist/${PACKAGE}/LICENSE"
          cp .cishape/release/THIRD_PARTY_LICENSES.html "dist/${PACKAGE}/THIRD_PARTY_LICENSES.html"
          cp Cargo.lock "dist/${PACKAGE}/Cargo.lock"
          cp -R policies "dist/${PACKAGE}/policies"
          cp -R catalogs "dist/${PACKAGE}/catalogs"

          tar -C dist -czf "dist/${PACKAGE}.tar.gz" "${PACKAGE}"
          (
            cd dist
            sha256sum "${PACKAGE}.tar.gz" > "${PACKAGE}.tar.gz.sha256"
          )

          archive_sha256="$(awk '{print $1}' "dist/${PACKAGE}.tar.gz.sha256")"
          license_sha256="$(sha256sum "dist/${PACKAGE}/LICENSE" | awk '{print $1}')"
          third_party_sha256="$(sha256sum "dist/${PACKAGE}/THIRD_PARTY_LICENSES.html" | awk '{print $1}')"

          jq -n \
            --arg schema_version "1" \
            --arg product "cishape" \
            --arg version "${VERSION}" \
            --arg target "${TARGET}" \
            --arg commit_sha "${GITHUB_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow_run_id "${GITHUB_RUN_ID}" \
            --arg workflow_run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg archive "${PACKAGE}.tar.gz" \
            --arg archive_sha256 "${archive_sha256}" \
            --arg lockfile_sha256 "${{ steps.lock.outputs.sha256 }}" \
            --arg project_license "AGPL-3.0-only" \
            --arg license_file_sha256 "${license_sha256}" \
            --arg third_party_licenses_sha256 "${third_party_sha256}" \
            '{
              schema_version: ($schema_version | tonumber),
              product: $product,
              version: $version,
              target: $target,
              commit_sha: $commit_sha,
              repository: $repository,
              workflow_run_id: $workflow_run_id,
              workflow_run_attempt: ($workflow_run_attempt | tonumber),
              archive: $archive,
              archive_sha256: $archive_sha256,
              lockfile_sha256: $lockfile_sha256,
              project_license: $project_license,
              license_file_sha256: $license_file_sha256,
              third_party_licenses_sha256: $third_party_licenses_sha256
            }' > "dist/${PACKAGE}.manifest.json"

          cp docs/releases/v0.1.2.md dist/v0.1.2-release-notes.md

      - name: Acceptance test extracted standalone package
        env:
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          set -euo pipefail
          mkdir -p acceptance
          tar -xzf "dist/${PACKAGE}.tar.gz" -C acceptance
          cd "acceptance/${PACKAGE}"

          ./cishape --help >/dev/null
          ./cishape catalog >/dev/null
          ./cishape observe --job smoke -- sh -c 'sleep 0.02' >/dev/null
          ./cishape report >/dev/null
          ./cishape profile smoke >/dev/null

          for _ in $(seq 1 10); do
            ./cishape observe --job smoke -- sh -c 'sleep 0.02' >/dev/null
          done

          ./cishape recommend smoke >/dev/null
          ./cishape explain smoke >/dev/null
          ./cishape advisory --format markdown >/dev/null

      - name: Upload verified release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cishape-v0.1.2-release-payload
          path: |
            dist/cishape-v0.1.2-x86_64-unknown-linux-gnu.tar.gz
            dist/cishape-v0.1.2-x86_64-unknown-linux-gnu.tar.gz.sha256
            dist/cishape-v0.1.2-x86_64-unknown-linux-gnu.manifest.json
            dist/v0.1.2-release-notes.md
          if-no-files-found: error
          retention-days: 90

  publish:
    name: publish-github-release
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cishape-v0.1.2-release-payload
          path: dist

      - name: Re-verify payload before publication
        run: |
          set -euo pipefail
          archive="dist/cishape-v0.1.2-x86_64-unknown-linux-gnu.tar.gz"
          checksum="${archive}.sha256"
          manifest="dist/cishape-v0.1.2-x86_64-unknown-linux-gnu.manifest.json"

          [ "$(jq -r '.version' "${manifest}")" = "0.1.2" ]
          [ "$(jq -r '.commit_sha' "${manifest}")" = "${GITHUB_SHA}" ]
          [ "$(jq -r '.repository' "${manifest}")" = "${GITHUB_REPOSITORY}" ]
          [ "$(jq -r '.project_license' "${manifest}")" = "AGPL-3.0-only" ]

          archive_sha="$(sha256sum "${archive}" | awk '{print $1}')"
          checksum_sha="$(awk '{print $1}' "${checksum}")"
          checksum_name="$(awk '{print $2}' "${checksum}")"
          manifest_sha="$(jq -r '.archive_sha256' "${manifest}")"

          [ "${checksum_name}" = "cishape-v0.1.2-x86_64-unknown-linux-gnu.tar.gz" ]
          [ "${archive_sha}" = "${checksum_sha}" ]
          [ "${archive_sha}" = "${manifest_sha}" ]

          mkdir -p dist/unpacked
          tar -xzf "${archive}" -C dist/unpacked
          package="dist/unpacked/cishape-v0.1.2-x86_64-unknown-linux-gnu"

          for required in cishape README.md QUICKSTART.md LICENSE THIRD_PARTY_LICENSES.html Cargo.lock policies/default-v1.json policies/economics-default-v1.json catalogs/providers-v1.json; do
            [ -f "${package}/${required}" ] || {
              echo "Release archive missing ${required}." >&2
              exit 1
            }
          done

          grep -q "GNU AFFERO GENERAL PUBLIC LICENSE" "${package}/LICENSE"
          grep -q "CIShape Third-Party Licenses" "${package}/THIRD_PARTY_LICENSES.html"
          [ "$(sha256sum "${package}/Cargo.lock" | awk '{print $1}')" = "$(jq -r '.lockfile_sha256' "${manifest}")" ]
          [ "$(sha256sum "${package}/LICENSE" | awk '{print $1}')" = "$(jq -r '.license_file_sha256' "${manifest}")" ]
          [ "$(sha256sum "${package}/THIRD_PARTY_LICENSES.html" | awk '{print $1}')" = "$(jq -r '.third_party_licenses_sha256' "${manifest}")" ]

      - name: Publish immutable v0.1.2 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.2 >/dev/null 2>&1; then
            echo "Tag v0.1.2 already exists; refusing to overwrite." >&2
            exit 1
          fi
          if gh release view v0.1.2 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release v0.1.2 already exists; refusing to overwrite." >&2
            exit 1
          fi

          gh release create v0.1.2 \
            dist/cishape-v0.1.2-x86_64-unknown-linux-gnu.tar.gz \
            dist/cishape-v0.1.2-x86_64-unknown-linux-gnu.tar.gz.sha256 \
            dist/cishape-v0.1.2-x86_64-unknown-linux-gnu.manifest.json \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "CIShape v0.1.2" \
            --notes-file dist/v0.1.2-release-notes.md
