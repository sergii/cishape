name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cishape-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRIES_CRATES_IO_PROTOCOL: sparse
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustc --version
          cargo --version

      # Fail before dependency resolution or native compilation.
      - name: Format
        run: cargo fmt --all -- --check

      - name: Resolve dependency graph
        run: cargo generate-lockfile

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cishape-ci
          key: duckdb-1.10505.0
          cache-on-failure: true

      # Build the observer once, then use that binary for the workloads below.
      - name: Build CIShape observer
        run: cargo build --locked --bin cishape

      - name: Test
        run: |
          target/debug/cishape observe             --job test             --output .cishape/runs/test.json             -- cargo test --locked --all-features

      - name: Clippy
        run: |
          target/debug/cishape observe             --job clippy             --output .cishape/runs/clippy.json             -- cargo clippy --locked --all-targets --all-features --no-deps -- -D warnings

      - name: POC0 demo
        run: |
          target/debug/cishape observe             --job demo             --output .cishape/runs/demo.json             -- target/debug/cishape demo

      - name: Upload CIShape observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cishape-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .cishape/runs/*.json
            .cishape/cishape.duckdb
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
